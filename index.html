<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tática Manager</title>
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tática Manager" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />

  <!-- Fontes locais (offline-first) -->
  <link rel="stylesheet" href="/fonts.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { background: #040d06; }

    /* ══════════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════════ */
    #msm-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #msm-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Fundo gradiente */
    #msm-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(22,163,74,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% -20%, rgba(10,40,20,0.9) 0%, transparent 60%),
        linear-gradient(180deg, #040d06 0%, #071209 50%, #040d06 100%);
    }

    /* Linhas de campo como textura */
    #msm-field-lines {
      position: absolute; inset: 0;
      opacity: 0.06;
      background-image:
        linear-gradient(transparent 49.8%, rgba(255,255,255,0.9) 49.8%, rgba(255,255,255,0.9) 50.2%, transparent 50.2%),
        linear-gradient(90deg, transparent 9.8%, rgba(255,255,255,0.6) 9.8%, rgba(255,255,255,0.6) 10.2%, transparent 10.2%),
        linear-gradient(90deg, transparent 89.8%, rgba(255,255,255,0.6) 89.8%, rgba(255,255,255,0.6) 90.2%, transparent 90.2%);
    }

    /* Círculo central do campo */
    #msm-field-circle {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 340px); height: min(70vw, 340px);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
    }

    /* ── Conteúdo central ── */
    #msm-content {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center;
    }

    /* ── Escudo ── */
    #msm-shield-wrap {
      position: relative;
      margin-bottom: 28px;
      animation: shieldAppear 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
      opacity: 0;
    }
    @keyframes shieldAppear {
      from { opacity: 0; transform: scale(0.55) translateY(24px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    #msm-shield-glow {
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,197,94,0.22) 0%, transparent 70%);
      animation: glowPulse 2.4s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: scale(0.88); }
      50%       { opacity: 1;   transform: scale(1.12); }
    }

    #msm-shield-svg {
      width: 112px; height: 122px;
      filter: drop-shadow(0 10px 28px rgba(34,197,94,0.45));
      animation: shieldFloat 3.8s ease-in-out infinite;
    }
    @keyframes shieldFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%       { transform: translateY(-7px) rotate(0.5deg); }
    }

    /* ── Títulos ── */
    #msm-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(1.45rem, 5.5vw, 1.95rem);
      color: #e8f5ec;
      letter-spacing: 0.14em;
      text-align: center;
      line-height: 1;
      margin: 0 0 5px;
      text-shadow: 0 0 40px rgba(34,197,94,0.25);
      animation: titleSlide 0.55s 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    #msm-subtitle {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: clamp(0.58rem, 2.2vw, 0.72rem);
      color: #22c55e;
      letter-spacing: 0.45em;
      text-align: center;
      margin: 0 0 38px;
      animation: titleSlide 0.55s 0.44s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes titleSlide {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Barra de progresso ── */
    #msm-progress-wrap {
      width: min(288px, 74vw);
      animation: fadeUp 0.5s 0.58s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #msm-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 8px;
    }

    #msm-hint {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.68rem;
      color: rgba(148,184,158,0.8);
      letter-spacing: 0.02em;
      transition: opacity 0.28s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #msm-hint.fading { opacity: 0; }

    #msm-pct {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 0.88rem;
      color: #22c55e;
      letter-spacing: 0.04em;
      text-shadow: 0 0 14px rgba(34,197,94,0.65);
      min-width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    #msm-bar-track {
      width: 100%;
      height: 3.5px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
    }

    #msm-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #15803d, #22c55e, #4ade80, #22c55e);
      background-size: 250% 100%;
      box-shadow: 0 0 12px rgba(34,197,94,0.55);
      transition: width 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      animation: barShimmer 2s linear infinite;
    }
    @keyframes barShimmer {
      0%   { background-position: 250% 0; }
      100% { background-position: -250% 0; }
    }

    /* Partículas flutuantes */
    .msm-particle {
      position: absolute;
      border-radius: 50%;
      background: #22c55e;
      pointer-events: none;
      opacity: 0;
      animation: particleRise linear infinite;
    }
    @keyframes particleRise {
      0%   { opacity: 0;   transform: translateY(0)     scale(0); }
      8%   { opacity: 0.5; transform: translateY(-8px)  scale(1); }
      85%  { opacity: 0.2; }
      100% { opacity: 0;   transform: translateY(-90px) scale(0.2); }
    }

    body:has(#msm-splash:not(.hidden)) #root { visibility: hidden; }
  </style>

  <script>
    (function() {
      var hints = [
        '⚽ Carregando os gramados...',
        '🏟️ Preparando os estádios...',
        '👕 Lavando as camisas...',
        '📋 Montando a prancheta...',
        '🤝 Contratando reforços...',
        '📊 Analisando a tabela...',
        '🎯 Treinando finalizações...',
        '💪 Aquecendo o elenco...',
        '🏆 A glória te espera...',
        '⚡ Quase em campo...',
      ];
      var hi = 0, startTime = Date.now();
      var pctEl, fillEl, hintEl;

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      /* Barra + número */
      function animateProgress() {
        pctEl  = pctEl  || document.getElementById('msm-pct');
        fillEl = fillEl || document.getElementById('msm-bar-fill');
        var t   = Math.min(1, (Date.now() - startTime) / 2800);
        var pct = Math.round(easeOut(t) * 90);
        if (pctEl)  pctEl.textContent  = pct + '%';
        if (fillEl) fillEl.style.width = pct + '%';
        if (t < 1) requestAnimationFrame(animateProgress);
      }
      requestAnimationFrame(animateProgress);

      /* Hints com fade */
      function nextHint() {
        hintEl = hintEl || document.getElementById('msm-hint');
        if (!hintEl) return;
        hintEl.classList.add('fading');
        setTimeout(function() {
          hintEl.textContent = hints[hi++ % hints.length];
          hintEl.classList.remove('fading');
        }, 280);
      }
      nextHint();
      var hintTimer = setInterval(nextHint, 950);

      /* Partículas */
      function spawnParticles() {
        var splash = document.getElementById('msm-splash');
        if (!splash) return;
        for (var d = 0; d < 10; d++) {
          var p = document.createElement('div');
          p.className = 'msm-particle';
          var size = 1.5 + Math.random() * 3;
          p.style.cssText = [
            'width:'  + size + 'px',
            'height:' + size + 'px',
            'left:'   + (15 + Math.random() * 70) + '%',
            'bottom:' + (15 + Math.random() * 35) + '%',
            'animation-duration:' + (2.8 + Math.random() * 3.5) + 's',
            'animation-delay:'    + (Math.random() * 2.5) + 's',
          ].join(';');
          splash.appendChild(p);
        }
      }
      document.addEventListener('DOMContentLoaded', spawnParticles);

      /* Detecta React montado */
      var obs = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          obs.disconnect();
          clearInterval(hintTimer);
          var fs = Date.now();
          (function fin() {
            pctEl  = pctEl  || document.getElementById('msm-pct');
            fillEl = fillEl || document.getElementById('msm-bar-fill');
            var t   = Math.min(1, (Date.now() - fs) / 400);
            var pct = Math.round(90 + t * 10);
            if (pctEl)  pctEl.textContent  = pct + '%';
            if (fillEl) fillEl.style.width = pct + '%';
            if (t < 1) { requestAnimationFrame(fin); return; }
            setTimeout(function() {
              var splash = document.getElementById('msm-splash');
              if (splash) {
                splash.classList.add('hidden');
                setTimeout(function() {
                  if (splash.parentNode) splash.parentNode.removeChild(splash);
                }, 700);
              }
            }, 150);
          })();
        }
      });
      document.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        if (root) obs.observe(root, { childList: true });
      });

      setTimeout(function() {
        var s = document.getElementById('msm-splash');
        if (s) s.classList.add('hidden');
      }, 14000);
    })();
  </script>
</head>
<body>

  <div id="msm-splash">
    <div id="msm-bg"></div>
    <div id="msm-field-lines"></div>
    <div id="msm-field-circle"></div>

    <div id="msm-content">

      <!-- Escudo SVG customizado -->
      <div id="msm-shield-wrap">
        <div id="msm-shield-glow"></div>

        <svg id="msm-shield-svg" viewBox="0 0 110 122" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="120%">
              <stop offset="0%"   stop-color="#163d24"/>
              <stop offset="100%" stop-color="#0a1e10"/>
            </linearGradient>
            <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#4ade80"/>
              <stop offset="45%"  stop-color="#22c55e"/>
              <stop offset="100%" stop-color="#15803d"/>
            </linearGradient>
            <linearGradient id="sg3" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%"   stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#d1fae5"/>
            </linearGradient>
            <radialGradient id="sg4" cx="40%" cy="35%">
              <stop offset="0%"   stop-color="rgba(255,255,255,0.2)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
            <filter id="gf" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Sombra do escudo -->
          <path d="M55 6 L104 22 L104 64 Q104 98 55 118 Q6 98 6 64 L6 22 Z"
                fill="rgba(0,0,0,0.35)" transform="translate(2,4)"/>

          <!-- Corpo do escudo -->
          <path d="M55 6 L104 22 L104 64 Q104 98 55 118 Q6 98 6 64 L6 22 Z"
                fill="url(#sg1)"/>

          <!-- Borda brilhante -->
          <path d="M55 6 L104 22 L104 64 Q104 98 55 118 Q6 98 6 64 L6 22 Z"
                fill="none"
                stroke="url(#sg2)"
                stroke-width="2.5"
                stroke-linejoin="round"/>

          <!-- Borda interna sutil -->
          <path d="M55 12 L98 26 L98 64 Q98 93 55 112 Q12 93 12 64 L12 26 Z"
                fill="none"
                stroke="rgba(34,197,94,0.12)"
                stroke-width="1"/>

          <!-- Reflexo no topo do escudo -->
          <path d="M55 6 L104 22 L104 64 Q104 98 55 118 Q6 98 6 64 L6 22 Z"
                fill="url(#sg4)"/>

          <!-- Divisória horizontal central -->
          <line x1="12" y1="62" x2="98" y2="62"
                stroke="rgba(34,197,94,0.18)" stroke-width="1"/>

          <!-- Círculo do campo -->
          <circle cx="55" cy="62" r="22"
                  fill="none"
                  stroke="rgba(34,197,94,0.16)" stroke-width="1.2"/>

          <!-- ── Bola de futebol ── -->
          <g filter="url(#gf)" transform="translate(55,57)">
            <!-- Bola base -->
            <circle cx="0" cy="0" r="17" fill="url(#sg3)"/>
            <!-- Padrão da bola: pentágono central escuro -->
            <polygon points="0,-9 8.6,-2.8 5.3,7.2 -5.3,7.2 -8.6,-2.8"
                     fill="#0f2d18" opacity="0.82"/>
            <!-- Costuras -->
            <line x1="0" y1="-17" x2="0" y2="-9"   stroke="#0f2d18" stroke-width="0.9" opacity="0.5"/>
            <line x1="0" y1="9"   x2="0" y2="17"    stroke="#0f2d18" stroke-width="0.9" opacity="0.5"/>
            <line x1="8.6" y1="-2.8" x2="16.2" y2="-5.3" stroke="#0f2d18" stroke-width="0.9" opacity="0.5"/>
            <line x1="-8.6" y1="-2.8" x2="-16.2" y2="-5.3" stroke="#0f2d18" stroke-width="0.9" opacity="0.5"/>
            <line x1="5.3" y1="7.2" x2="9.9" y2="14.1" stroke="#0f2d18" stroke-width="0.9" opacity="0.5"/>
            <line x1="-5.3" y1="7.2" x2="-9.9" y2="14.1" stroke="#0f2d18" stroke-width="0.9" opacity="0.5"/>
            <!-- Brilho -->
            <circle cx="-5" cy="-7" r="4.5" fill="rgba(255,255,255,0.35)"/>
          </g>

          <!-- ── 3 estrelas douradas abaixo da bola ── -->
          <g fill="#f59e0b">
            <!-- estrela esquerda -->
            <g transform="translate(33,92) scale(0.75)">
              <polygon points="0,-7 1.6,-2.4 6.7,-2.4 2.7,0.9 4.1,5.7 0,2.8 -4.1,5.7 -2.7,0.9 -6.7,-2.4 -1.6,-2.4"/>
            </g>
            <!-- estrela central -->
            <g transform="translate(55,90) scale(0.85)">
              <polygon points="0,-7 1.6,-2.4 6.7,-2.4 2.7,0.9 4.1,5.7 0,2.8 -4.1,5.7 -2.7,0.9 -6.7,-2.4 -1.6,-2.4"/>
            </g>
            <!-- estrela direita -->
            <g transform="translate(77,92) scale(0.75)">
              <polygon points="0,-7 1.6,-2.4 6.7,-2.4 2.7,0.9 4.1,5.7 0,2.8 -4.1,5.7 -2.7,0.9 -6.7,-2.4 -1.6,-2.4"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Título com Cinzel -->
      <div id="msm-title">CLUBE DE</div>
      <div id="msm-subtitle">BOLSO</div>

      <!-- Progresso -->
      <div id="msm-progress-wrap">
        <div id="msm-progress-header">
          <span id="msm-hint">⚽ Carregando os gramados...</span>
          <span id="msm-pct">0%</span>
        </div>
        <div id="msm-bar-track">
          <div id="msm-bar-fill"></div>
        </div>
      </div>

    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
