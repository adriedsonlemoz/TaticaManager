<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tática Manager</title>
  <meta name="theme-color" content="#04150b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tática Manager" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />

  <!-- Fontes locais (offline-first) -->
  <link rel="stylesheet" href="/fonts.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
    html, body { background: #04150b; }

    /* Splash web: usa exatamente a arte aprovada. O splash nativo do Android
       recebe a mesma arte pelo pipeline de branding. */
    #msm-splash {
      position: fixed; inset: 0; z-index: 9999;
      overflow: hidden; background: #04150b;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #msm-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #msm-brand-image {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: 50% 50%;
      user-select: none; -webkit-user-drag: none;
    }
    #msm-shade {
      position: absolute; inset: auto 0 0; height: 30%;
      background: linear-gradient(180deg, transparent, rgba(0,10,4,.74) 58%, rgba(0,8,3,.92));
      pointer-events: none;
    }
    #msm-content {
      position: absolute; left: 50%; bottom: max(5.5vh, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: min(330px, 78vw); z-index: 2;
      animation: msmFade .5s .18s both;
    }
    @keyframes msmFade { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    #msm-progress-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
    #msm-hint {
      min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      color:rgba(240,253,244,.9); font:800 .72rem/1.2 'Nunito','Segoe UI',sans-serif;
      text-shadow:0 1px 4px rgba(0,0,0,.7); transition:opacity .28s ease;
    }
    #msm-hint.fading { opacity:0; }
    #msm-pct { color:#9dff35; font:900 .82rem/1 'Nunito','Segoe UI',sans-serif; min-width:42px; text-align:right; }
    #msm-bar-track { height:5px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.14); box-shadow:0 0 0 1px rgba(255,255,255,.06); }
    #msm-bar-fill { height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#15803d,#84ff20,#d9ff81); box-shadow:0 0 14px rgba(132,255,32,.6); transition:width .34s ease; }
    .msm-particle { display:none; }
    body:has(#msm-splash:not(.hidden)) #root { visibility:hidden; }
  </style>

  <script>
    (function() {
      var hints = [
        '⚽ Carregando os gramados...',
        '🏟️ Preparando os estádios...',
        '👕 Lavando as camisas...',
        '📋 Montando a prancheta...',
        '🤝 Contratando reforços...',
        '📊 Analisando a tabela...',
        '🎯 Treinando finalizações...',
        '💪 Aquecendo o elenco...',
        '🏆 A glória te espera...',
        '⚡ Quase em campo...',
      ];
      var hi = 0, startTime = Date.now();
      var pctEl, fillEl, hintEl;

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      /* Barra + número */
      function animateProgress() {
        pctEl  = pctEl  || document.getElementById('msm-pct');
        fillEl = fillEl || document.getElementById('msm-bar-fill');
        var t   = Math.min(1, (Date.now() - startTime) / 2800);
        var pct = Math.round(easeOut(t) * 90);
        if (pctEl)  pctEl.textContent  = pct + '%';
        if (fillEl) fillEl.style.width = pct + '%';
        if (t < 1) requestAnimationFrame(animateProgress);
      }
      requestAnimationFrame(animateProgress);

      /* Hints com fade */
      function nextHint() {
        hintEl = hintEl || document.getElementById('msm-hint');
        if (!hintEl) return;
        hintEl.classList.add('fading');
        setTimeout(function() {
          hintEl.textContent = hints[hi++ % hints.length];
          hintEl.classList.remove('fading');
        }, 280);
      }
      nextHint();
      var hintTimer = setInterval(nextHint, 950);

      /* Partículas */
      function spawnParticles() {
        var splash = document.getElementById('msm-splash');
        if (!splash) return;
        for (var d = 0; d < 10; d++) {
          var p = document.createElement('div');
          p.className = 'msm-particle';
          var size = 1.5 + Math.random() * 3;
          p.style.cssText = [
            'width:'  + size + 'px',
            'height:' + size + 'px',
            'left:'   + (15 + Math.random() * 70) + '%',
            'bottom:' + (15 + Math.random() * 35) + '%',
            'animation-duration:' + (2.8 + Math.random() * 3.5) + 's',
            'animation-delay:'    + (Math.random() * 2.5) + 's',
          ].join(';');
          splash.appendChild(p);
        }
      }
      document.addEventListener('DOMContentLoaded', spawnParticles);

      /* Detecta React montado */
      var obs = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          obs.disconnect();
          clearInterval(hintTimer);
          var fs = Date.now();
          (function fin() {
            pctEl  = pctEl  || document.getElementById('msm-pct');
            fillEl = fillEl || document.getElementById('msm-bar-fill');
            var t   = Math.min(1, (Date.now() - fs) / 400);
            var pct = Math.round(90 + t * 10);
            if (pctEl)  pctEl.textContent  = pct + '%';
            if (fillEl) fillEl.style.width = pct + '%';
            if (t < 1) { requestAnimationFrame(fin); return; }
            setTimeout(function() {
              var splash = document.getElementById('msm-splash');
              if (splash) {
                splash.classList.add('hidden');
                setTimeout(function() {
                  if (splash.parentNode) splash.parentNode.removeChild(splash);
                }, 700);
              }
            }, 150);
          })();
        }
      });
      document.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        if (root) obs.observe(root, { childList: true });
      });

      setTimeout(function() {
        var s = document.getElementById('msm-splash');
        if (s) s.classList.add('hidden');
      }, 14000);
    })();
  </script>
</head>
<body>

  <div id="msm-splash" role="status" aria-label="Tática Manager iniciando">
    <img id="msm-brand-image" src="/brand/tatica-manager-splash.png" alt="" aria-hidden="true" />
    <div id="msm-shade" aria-hidden="true"></div>
    <div id="msm-content">
      <div id="msm-progress-header">
        <span id="msm-hint">⚽ Carregando os gramados...</span>
        <span id="msm-pct">0%</span>
      </div>
      <div id="msm-bar-track"><div id="msm-bar-fill"></div></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
